name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for sensitive paths
        run: bash scripts/security/check-sensitive-paths.sh --all

      - name: Scan for leaked secrets
        run: bash scripts/security/check-secrets.sh --all
